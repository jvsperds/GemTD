<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GemTD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #fff;
        font: 14px sans-serif;
        pointer-events: none;
      }
      #panel {
        position: fixed;
        bottom: 8px;
        left: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        max-width: calc(100vw - 16px);
      }
      #panel button {
        font: 13px sans-serif;
      }
      #debug {
        position: fixed;
        top: 32px;
        right: 8px;
        margin: 0;
        padding: 6px;
        color: #0f0;
        background: #000c;
        font: 12px monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="panel">
      <button data-a="keep">Keep (K)</button>
      <button data-a="merge2">Merge ^ (M)</button>
      <button data-a="merge4">Merge ^^ (N)</button>
      <button data-a="down">Downgrade 200g (D)</button>
      <button data-a="stone">Remove stone (R)</button>
      <button data-a="level">Buy level (L)</button>
    </div>
    <pre id="debug" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
